name: Verify main

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: https://nahptrsihcidcxkjzwdp.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5haHB0cnNpaGNpZGN4a2p6d2RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjI5OTgsImV4cCI6MjEwMzU5ODk5OH0.Q01osKJJrRDsg94LRsY70kytk8Ktoe2-lSUYG7I1S-8

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run typecheck
      - name: Typecheck application and test suites
        run: npm run typecheck:all
      - run: npm run test:unit
      - run: npm run build

  db:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Apply auth stub (CI only, never on real Supabase)
        run: node scripts/db/apply-migration.js --file supabase/ci/stub_auth.sql
      - name: Apply canonical migrations
        run: node scripts/db/apply-migration.js --dir supabase/migrations
      - name: Verify schema
        run: node scripts/db/verify-schema.js
      - name: Run integration and security/RLS regression tests
        run: npm run test:integration

  browser-smoke:
    needs: [verify, db]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Run Playwright smoke tests
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-playwright-report
          path: playwright-report/
          retention-days: 7
